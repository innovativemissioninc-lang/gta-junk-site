[build]
  publish = "."
  # Guard: run ./check-before-deploy.sh locally before pushing price-token changes
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Rocky is a short, chatty endpoint; it needs no bundled extras.
# Rocky's voice. Returns audio, so it needs no bundled extras either.
[functions."tts"]
  included_files = []

[functions."rocky"]
  included_files = []

# The estimate endpoint needs headroom: vision analysis of 8 frames.
[functions."estimate"]
  included_files = []

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # microphone must name elevenlabs.io explicitly. "microphone=(self)" permits
    # only our own origin, so the ElevenLabs agent was refused the microphone and
    # the widget reported "Permission denied" the moment a call started. Verified
    # on the live page: allowsFeature("microphone","https://elevenlabs.io") was false.
    Permissions-Policy = "camera=(self), microphone=(self \"https://elevenlabs.io\"), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

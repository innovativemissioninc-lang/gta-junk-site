[build]
  publish = "."
  # Guard: run ./check-before-deploy.sh locally before pushing price-token changes
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Rocky is a short, chatty endpoint; it needs no bundled extras.
[functions."rocky"]
  included_files = []

# The estimate endpoint needs headroom: vision analysis of 8 frames.
[functions."estimate"]
  included_files = []

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
